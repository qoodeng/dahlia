name: Factory close

# Closes a factory PR's bead (its branch is factory/<bead-id>) in the owner's beads database on
# this Mac when the PR merges. Beads runs in stealth mode here: the backlog never leaves the Mac.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  close:
    # Never for forks: only the owner's own factory branches reach the owner's Mac.
    if: >-
      github.event.pull_request.merged
      && startsWith(github.head_ref, 'factory/')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, dahlia-factory]
    env:
      PATH: /opt/homebrew/bin:/usr/bin:/bin
      FACTORY_BEADS_REPO: /Users/christianstephens/Projects/dahlia
      BEAD: ${{ github.head_ref }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Close the bead
        run: |
          cd "$FACTORY_BEADS_REPO"
          bead=${BEAD#factory/}
          # Only factory runs' branches name a bead; anything else is not the factory's to close.
          if ! bd show "$bead" >/dev/null 2>&1; then echo "$bead is not a bead; nothing to close."; exit 0; fi
          bd close "$bead" --reason "Merged in PR #$PR"
