name: Factory

# Labelling an issue `factory` runs Fabro's ship workflow on this Mac's dahlia-factory runner
# and turns the result into a pull request. GitHub hands the job over within seconds of the
# label; there is no queue or timer of our own.
on:
  issues:
    types: [labeled]

# The job token pushes the PR branch, opens the PR, starts CI and turns on auto-merge.
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: factory-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ship:
    # Only the owner's label starts a run: the repository is public, issue text becomes an
    # agent's instructions, and this job runs on the owner's Mac.
    if: github.event.label.name == 'factory' && github.event.sender.login == github.repository_owner
    runs-on: [self-hosted, dahlia-factory]
    timeout-minutes: 240
    env:
      PATH: /Users/christianstephens/.fabro/bin:/Users/christianstephens/.cargo/bin:/Users/christianstephens/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # Full history: Fabro clones this checkout for the run's workspace.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Write the goal
        run: printf '%s\n\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" >"$RUNNER_TEMP/goal.md"

      - name: Run the ship workflow
        id: run
        run: |
          run_id=$(fabro run .fabro/workflows/ship/workflow.toml --goal-file "$RUNNER_TEMP/goal.md" \
            --environment local --label "issue=$ISSUE" --detach | tail -1)
          echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
          gh issue comment "$ISSUE" --body "Factory run \`$run_id\` started."
          fabro wait "$run_id" || true
          status=$(fabro inspect "$run_id" | jq -r '.[0].status.kind')
          echo "Run $run_id finished: $status"
          [ "$status" = "succeeded" ]

      - name: Open the pull request
        run: bash .fabro/workflows/ship/open-pr.sh "${{ steps.run.outputs.run_id }}" "$ISSUE"

      - name: Report a failed run
        if: failure()
        run: |
          gh issue edit "$ISSUE" --add-label factory-failed --remove-label factory
          gh issue comment "$ISSUE" --body "Factory run \`${{ steps.run.outputs.run_id }}\` did not produce a pull request. Details: \`fabro inspect ${{ steps.run.outputs.run_id }}\` on the Mac."
