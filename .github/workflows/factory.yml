name: Factory

# `factory start <bead>` (~/.local/bin/factory) dispatches this with the bead's id, title and
# description. It runs Fabro's ship workflow on this Mac's dahlia-factory runner and turns the
# result into a pull request. Beads is the backlog; GitHub only holds code, PRs and CI.
on:
  workflow_dispatch:
    inputs:
      bead:
        description: Bead id (e.g. dahlia-a3f2)
        required: true
      title:
        description: Bead title, used as the PR title
        required: true
      goal:
        description: Bead description, the spec the agents build from
        required: true

permissions:
  contents: read
  # Start the next queued beads (factory next): list runs, dispatch this workflow.
  actions: write
  pull-requests: read

concurrency:
  group: factory-${{ inputs.bead }}
  cancel-in-progress: false

jobs:
  ship:
    # Only the owner starts runs (factory-refresh.yml re-runs a conflicting bead as the Actions
    # bot): the bead becomes an agent's instructions on the owner's Mac.
    if: github.actor == github.repository_owner || github.actor == 'github-actions[bot]'
    runs-on: [self-hosted, dahlia-factory]
    timeout-minutes: 240
    env:
      PATH: /Users/christianstephens/.fabro/bin:/Users/christianstephens/.cargo/bin:/Users/christianstephens/.local/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
      FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
      # The owner's checkout, whose .beads database the run reports to.
      FACTORY_BEADS_REPO: /Users/christianstephens/Projects/dahlia
      BEAD: ${{ inputs.bead }}
      ISSUE_TITLE: ${{ inputs.title }}
      GOAL: ${{ inputs.goal }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      # No sccache: an agent-sandboxed sccache server fails every build that uses it.
      RUSTC_WRAPPER: ""
    steps:
      # Full history: Fabro clones this checkout for the run's workspace.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Write the goal
        run: printf '%s\n\n%s\n' "$ISSUE_TITLE" "$GOAL" >"$RUNNER_TEMP/goal.md"

      # A failed run gets one retry, so a passing model or tool error never needs the owner.
      - name: Run the ship workflow
        id: run
        run: |
          for attempt in 1 2; do
            run_id=$(fabro run .fabro/workflows/ship/workflow.toml --goal-file "$RUNNER_TEMP/goal.md" \
              --environment local --label "bead=$BEAD" --label "attempt=$attempt" --detach | tail -1)
            echo "run_id=$run_id" >>"$GITHUB_OUTPUT"
            # Bead updates are best-effort: only the run itself decides success.
            (cd "$FACTORY_BEADS_REPO" && bd comment "$BEAD" "Factory run $run_id started (attempt $attempt).") || true
            fabro wait "$run_id" || true
            status=$(fabro inspect "$run_id" | jq -r '.[0].status.kind')
            echo "Run $run_id (attempt $attempt) finished: $status"
            if [ "$status" = "succeeded" ]; then exit 0; fi
          done
          exit 1

      - name: Open the pull request
        run: |
          set -o pipefail
          url=$(bash .fabro/workflows/ship/open-pr.sh "${{ steps.run.outputs.run_id }}" "$BEAD" | tail -1)
          [ -n "$url" ]
          (cd "$FACTORY_BEADS_REPO" && bd comment "$BEAD" "Pull request opened: $url") || true

      # A cancelled or timed-out job must not leave its Fabro run working with no one to collect it.
      - name: Stop the Fabro run
        if: cancelled() && steps.run.outputs.run_id != ''
        run: fabro rm --force "${{ steps.run.outputs.run_id }}" || true

      - name: Report a failed run
        if: failure()
        run: |
          cd "$FACTORY_BEADS_REPO"
          bd update "$BEAD" --status open --add-label factory-failed --remove-label factory
          bd comment "$BEAD" "Factory run ${{ steps.run.outputs.run_id }} did not produce a pull request after 2 attempts. Details: fabro inspect ${{ steps.run.outputs.run_id }}. Retry with: factory start $BEAD"

      # A re-run after a failed conflict resolve (factory-resolve.yml) is over: refreshable again.
      - name: Clear the refresh flag
        if: always()
        run: cd "$FACTORY_BEADS_REPO" && bd update "$BEAD" --remove-label factory-refreshing >/dev/null || true

      # This runner is free now: hand it the next queued bead that is ready. One run at a time
      # (factory next 1) keeps the other runner free for factory-close, -refresh and -resolve,
      # which would otherwise wait behind a run that takes tens of minutes.
      - name: Start the next queued beads
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: cd "$FACTORY_BEADS_REPO" && factory next 1
