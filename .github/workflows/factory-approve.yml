name: Factory approve

# Adding `factory-automerge` to a factory PR (your approval of a visual change) turns on GitHub
# auto-merge, which merges once the required macOS check passes. Non-visual factory PRs get
# auto-merge when they are opened, so they never wait here.
on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  approve:
    if: >-
      github.event.label.name == 'factory-automerge'
      && github.event.sender.login == github.repository_owner
      && startsWith(github.head_ref, 'factory/issue-')
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Turn on auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --auto --squash
