name: Factory merge

# Merges a factory pull request once it carries `factory-automerge` and CI's macOS job passed on
# its head. Only that job counts. GitHub's own auto-merge needs branch protection,
# which this private repository's plan lacks, so this workflow is the merge gate. It reacts to
# CI finishing and to the label being added (your approval of a visual change); it never polls.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  merge:
    if: >-
      (github.event_name == 'workflow_run'
        && github.event.workflow_run.head_repository.full_name == github.repository
        && startsWith(github.event.workflow_run.head_branch, 'factory/issue-'))
      || (github.event_name == 'pull_request'
        && github.event.label.name == 'factory-automerge'
        && github.event.pull_request.head.repo.full_name == github.repository
        && startsWith(github.head_ref, 'factory/issue-'))
    runs-on: [self-hosted, dahlia-factory]
    env:
      PATH: /opt/homebrew/bin:/usr/bin:/bin
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch || github.head_ref }}
    steps:
      - name: Merge if labelled and CI's macOS job passed on the head commit
        run: |
          pr=$(gh pr view "$BRANCH" --json number,state,headRefOid,labels)
          number=$(jq -r .number <<<"$pr")
          head=$(jq -r .headRefOid <<<"$pr")
          if [ "$(jq -r .state <<<"$pr")" != OPEN ]; then echo "PR #$number is not open."; exit 0; fi
          if ! jq -e '.labels | map(.name) | index("factory-automerge")' <<<"$pr" >/dev/null; then
            echo "PR #$number waits for review (no factory-automerge label)."; exit 0
          fi
          run=$(gh run list --workflow CI --commit "$head" --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run" ]; then echo "No CI run for $head yet."; exit 0; fi
          macos=$(gh run view "$run" --json jobs \
            --jq '.jobs[] | select(.name | startswith("macOS")) | "\(.status)/\(.conclusion)"')
          if [ "$macos" != "completed/success" ]; then echo "CI macOS job on $head is $macos; not merging."; exit 0; fi
          gh pr merge "$number" --squash --delete-branch --match-head-commit "$head"
