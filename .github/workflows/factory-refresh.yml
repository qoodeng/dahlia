name: Factory refresh

# After main moves, keeps open factory PRs mergeable. A PR that now conflicts is rebased onto
# main and force-pushed with FACTORY_TOKEN, which re-runs its CI. If the rebase itself conflicts,
# factory-resolve.yml has an agent resolve the conflicts and updates the same PR. The bead carries
# factory-refreshing until that ends, so later pushes to main do not start it again.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: factory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: [self-hosted, dahlia-factory]
    env:
      PATH: /Users/christianstephens/.local/bin:/opt/homebrew/bin:/usr/bin:/bin
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
      FACTORY_BEADS_REPO: /Users/christianstephens/Projects/dahlia
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Rebase or re-run conflicting factory PRs
        run: |
          auth=$(printf 'x-access-token:%s' "$FACTORY_TOKEN" | base64)
          git fetch -q origin '+refs/heads/factory/*:refs/remotes/origin/factory/*'
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("factory/")) | "\(.number) \(.headRefName)"' |
          while read -r number branch; do
            # GitHub computes mergeability lazily; ask until it has an answer.
            state=UNKNOWN
            for _ in 1 2 3 4 5 6; do
              state=$(gh pr view "$number" --json mergeable --jq .mergeable)
              [ "$state" != UNKNOWN ] && break
              sleep 5
            done
            echo "PR #$number ($branch): $state"
            [ "$state" = CONFLICTING ] || continue

            git switch -q -C "$branch" "origin/$branch"
            if git -c user.name="Dahlia Factory" -c user.email="84674359+qoodeng@users.noreply.github.com" \
                rebase -q origin/main; then
              git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
                push -q --force-with-lease "https://github.com/$GH_REPO.git" "HEAD:refs/heads/$branch"
              echo "PR #$number rebased onto main."
            else
              git rebase --abort
              bead=${branch#factory/}
              json=$(cd "$FACTORY_BEADS_REPO" && bd show "$bead" --json) || { echo "$bead is not a bead; skipped."; git switch -q --detach origin/main; continue; }
              if jq -e '.[0].labels // [] | index("factory-refreshing")' <<<"$json" >/dev/null; then
                echo "PR #$number conflicts; $bead is already being refreshed."
              else
                (cd "$FACTORY_BEADS_REPO" && bd update "$bead" --add-label factory-refreshing >/dev/null)
                gh workflow run factory-resolve.yml -f pr="$number" -f branch="$branch" -f bead="$bead"
                (cd "$FACTORY_BEADS_REPO" && bd comment "$bead" "PR #$number conflicts with main; resolving.") || true
                echo "PR #$number conflicts; resolving $bead."
              fi
            fi
            git switch -q --detach origin/main
          done

      # A merge is a push to main, so this closes the beads of factory PRs that merged and then hands the
      # free runner the next queued bead (closing one may unblock the next in a chain). It replaces a
      # pull_request-triggered job: nothing a pull request can change reaches this self-hosted runner.
      - name: Close merged beads and start the next queued bead
        run: |
          cd "$FACTORY_BEADS_REPO"
          for bead in $(bd list --status in_progress --label factory --json --limit 0 | jq -r '.[].id'); do
            pr=$(gh pr list --head "factory/$bead" --state merged --json number --jq '.[0].number // empty')
            [ -n "$pr" ] || continue
            bd close "$bead" --reason "Merged in PR #$pr" >/dev/null
            echo "Closed $bead (PR #$pr)."
          done
          factory next 1

